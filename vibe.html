<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Vibe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 16px;
            color: #555;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 24px 0;
            width: 100%;
            max-width: 260px;
        }

        a.button {
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 10px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            background: #111;
            color: #fff;
            transition: 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        a.button:hover {
            background: #333;
        }

        .ig-button {
            background: #fff;
            border: 1px solid #ddd;
            color: #000;
        }

        .ig-button:hover {
            background: #f0f0f0;
        }

        .ig-icon {
            width: 20px;
            height: 20px;
        }

        footer {
            margin-top: 32px;
            font-size: 13px;
            color: #777;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <h1>Vibe</h1>
        <p class="subtitle">Plan the vibe. Live the moment.</p>
    </header>

    <div class="links">
        <!-- App link -->
        <a class="button" href="https://vibe-planner-DanielleMcIntosh.replit.app" target="_blank"
            rel="noopener noreferrer">
            Open the App
        </a>

        <!-- Instagram link -->
        <a class="button ig-button" href="YOUR_INSTAGRAM_URL_HERE" target="_blank" rel="noopener noreferrer">
            <img class="ig-icon" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"
                alt="Instagram" />
            Instagram
        </a>
    </div>

    <footer>
        © <span id="year"></span> Vibe. All rights reserved.
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>

</html>
